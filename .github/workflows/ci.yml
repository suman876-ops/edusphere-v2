name: Verify site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run the site checks
        run: python3 tools/build.py --check

      - name: Fail if the checks rewrote anything
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "The checks modified tracked files — commit the result."
            git --no-pager diff --stat
            exit 1
          fi
