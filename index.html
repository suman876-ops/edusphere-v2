<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>EduSphere — Maintenance in progress</title>
<meta name="description" content="This website is under maintenance. Please check back shortly." />
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#f8f2e7" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect width='24' height='24' rx='6' fill='%23a5142c'/><path d='M12 3.6 5.6 5.9v4.8c0 3.7 2.6 6.9 6.4 8.3 3.8-1.4 6.4-4.6 6.4-8.3V5.9L12 3.6Z' fill='%23fff6e6'/><path d='M8.6 8.2h6.8M8.6 10.9h6.8M8.6 13.6h4.2' stroke='%23a5142c' stroke-width='1.1' stroke-linecap='round'/></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --paper: #f8f2e7;
    --paper-2: #f2e8d6;
    --paper-3: #fffdf8;

    --ink: #33201a;
    --ink-soft: #6a4a3b;
    --ink-faint: #7d6353;

    --maroon: #a5142c;
    --maroon-deep: #7d0f22;
    --maroon-soft: #c2404f;

    --gold: #b8892f;
    --gold-soft: #d9b978;
    --gold-line: rgba(184, 137, 47, 0.35);

    --line: rgba(120, 74, 42, 0.16);
    --line-soft: rgba(120, 74, 42, 0.09);

    --glass-strong: rgba(255, 253, 249, 0.9);

    --shadow-lift: 0 34px 70px -34px rgba(86, 45, 16, 0.55);

    --r-sm: 12px;
    --r: 18px;
    --r-lg: 26px;

    --display: "Fraunces", "Iowan Old Style", Georgia, "Times New Roman", serif;
    --sans: "Plus Jakarta Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
    display: flex;
    min-height: 100vh;
    min-height: 100dvh;
    padding: clamp(16px, 4vw, 40px);
    overflow-x: hidden;
    overflow-y: auto;
  }

  /* ================================================= the blurred site behind */
  .backdrop {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
    user-select: none;
  }

  .backdrop-inner {
    position: absolute;
    inset: -40px;
    filter: blur(10px) saturate(0.95);
    opacity: 1;
    transform: scale(1.02);
  }

  /* warm paper wash, same as the live site */
  .wash {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(900px 620px at 50% -8%, #fffaf0 0%, transparent 62%),
      radial-gradient(720px 520px at 6% 24%, rgba(217, 185, 120, 0.3), transparent 64%),
      radial-gradient(760px 560px at 96% 62%, rgba(165, 20, 44, 0.1), transparent 62%),
      linear-gradient(180deg, var(--paper) 0%, var(--paper-2) 100%);
  }

  .weave {
    position: absolute;
    inset: 0;
    opacity: 0.5;
    background-image:
      repeating-linear-gradient(0deg, rgba(120, 74, 42, 0.05) 0 1px, transparent 1px 3px),
      repeating-linear-gradient(90deg, rgba(120, 74, 42, 0.05) 0 1px, transparent 1px 3px);
    mix-blend-mode: multiply;
  }

  .mock {
    position: relative;
    max-width: 1160px;
    margin: 0 auto;
    padding: 26px clamp(18px, 3.4vw, 32px);
  }

  .mock-nav {
    display: flex;
    align-items: center;
    gap: 26px;
    padding-bottom: 26px;
    border-bottom: 1px solid var(--line-soft);
  }

  .mock-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-right: auto;
  }

  .mock-mark {
    width: 38px;
    height: 38px;
    border-radius: 11px;
    background: var(--maroon);
    color: #fff6e6;
    font-family: var(--display);
    font-size: 20px;
    font-weight: 600;
    display: grid;
    place-items: center;
  }

  .mock-brand b {
    font-family: var(--display);
    font-size: 19px;
    letter-spacing: -0.01em;
  }

  .mock-link {
    height: 9px;
    width: 62px;
    border-radius: 99px;
    background: rgba(120, 74, 42, 0.22);
  }

  .mock-cta {
    height: 34px;
    width: 86px;
    border-radius: 99px;
    background: var(--maroon);
    opacity: 0.75;
  }

  .mock-hero { padding: 54px 0 34px; max-width: 760px; }

  .mock-eyebrow {
    display: inline-block;
    height: 26px;
    width: 220px;
    border-radius: 99px;
    background: rgba(184, 137, 47, 0.28);
    border: 1px solid var(--gold-line);
    margin-bottom: 22px;
  }

  .mock-h1 {
    font-family: var(--display);
    font-size: clamp(34px, 5.4vw, 62px);
    line-height: 1.06;
    letter-spacing: -0.02em;
    margin: 0 0 20px;
    color: var(--ink);
  }

  .mock-line {
    height: 11px;
    border-radius: 99px;
    background: rgba(120, 74, 42, 0.16);
    margin-bottom: 12px;
  }

  .mock-line.w90 { width: 92%; }
  .mock-line.w75 { width: 78%; }
  .mock-line.w60 { width: 61%; }

  .mock-actions { display: flex; gap: 12px; margin-top: 26px; }

  .mock-btn {
    height: 46px;
    width: 190px;
    border-radius: 99px;
    background: var(--maroon);
    opacity: 0.7;
  }

  .mock-btn.ghost {
    background: transparent;
    border: 1px solid var(--line);
    width: 160px;
  }

  .mock-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 12px;
    margin-top: 44px;
  }

  .mock-card {
    height: 92px;
    border-radius: var(--r);
    background: rgba(255, 252, 246, 0.72);
    border: 1px solid var(--line);
  }

  .mock-rows { margin-top: 34px; }

  .mock-row {
    height: 42px;
    border-radius: 10px;
    background: rgba(255, 252, 246, 0.6);
    border: 1px solid var(--line-soft);
    margin-bottom: 9px;
  }

  /* ============================================================= the veil */
  .veil {
    position: fixed;
    inset: 0;
    z-index: 1;
    background:
      radial-gradient(640px 460px at 50% 44%, rgba(255, 251, 242, 0.46), rgba(248, 242, 231, 0.24) 62%, rgba(242, 232, 214, 0.3) 100%),
      linear-gradient(180deg, rgba(248, 242, 231, 0.12), rgba(242, 232, 214, 0.28));
    pointer-events: none;
  }

  /* ============================================================= the card */
  .panel {
    position: relative;
    z-index: 2;
    margin: auto;
    width: min(720px, 100%);
    background: var(--glass-strong);
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    box-shadow: var(--shadow-lift);
    padding: clamp(30px, 5vw, 58px) clamp(24px, 4.6vw, 56px);
    text-align: center;
    overflow: hidden;
    animation: rise 0.62s cubic-bezier(0.22, 0.9, 0.28, 1) both;
  }

  .panel::before {
    content: "";
    position: absolute;
    inset: 0 0 auto;
    height: 4px;
    background: linear-gradient(90deg, var(--maroon) 0%, var(--maroon-soft) 45%, var(--gold-soft) 100%);
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(16px) scale(0.985); }
    to { opacity: 1; transform: none; }
  }

  .brand {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin-bottom: clamp(22px, 3.4vw, 32px);
  }

  .brand-mark {
    width: 44px;
    height: 44px;
    border-radius: 13px;
    background: var(--maroon);
    color: #fff6e6;
    font-family: var(--display);
    font-size: 23px;
    font-weight: 600;
    display: grid;
    place-items: center;
    box-shadow: 0 10px 22px -14px rgba(125, 15, 34, 0.9);
  }

  .brand-text b {
    display: block;
    font-family: var(--display);
    font-size: 20px;
    letter-spacing: -0.01em;
    line-height: 1.2;
  }

  .brand-text small {
    display: block;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }



  h1 {
    font-family: var(--display);
    font-weight: 600;
    font-size: clamp(34px, 6.2vw, 62px);
    line-height: 1.04;
    letter-spacing: -0.028em;
    margin: 0 0 clamp(16px, 2.4vw, 22px);
  }

  h1 em {
    font-style: italic;
    color: var(--maroon);
  }

  .lede {
    margin: 0 auto;
    color: var(--ink-soft);
    font-size: clamp(15.5px, 1.5vw, 18px);
    max-width: 34ch;
    text-wrap: balance;
  }










  @media (prefers-reduced-motion: reduce) {
    .panel { animation: none; }
  }
</style>
</head>
<body>

<!-- the live site, blurred behind the notice -->
<div class="backdrop" aria-hidden="true">
  <div class="backdrop-inner">
    <div class="wash"></div>

      <div class="mock-nav">
        <div class="mock-brand">
          <span class="mock-mark">E</span>

        <span class="mock-link"></span>
        <span class="mock-link"></span>

        <span class="mock-link"></span>

      </div>

      <div class="mock-hero">
        <span class="mock-eyebrow"></span>
        <p class="mock-h1">Every college. One place to join them.</p>
        <div class="mock-line w90"></div>

        <div class="mock-line w60"></div>
        <div class="mock-actions">
          <span class="mock-btn"></span>

      <div class="mock-grid">
        <span class="mock-card"></span><span class="mock-card"></span><span class="mock-card"></span>
        <span class="mock-card"></span><span class="mock-card"></span><span class="mock-card"></span>
        <span class="mock-card"></span><span class="mock-card"></span><span class="mock-card"></span>
        <span class="mock-card"></span><span class="mock-card"></span><span class="mock-card"></span>
      </div>

      <div class="mock-rows">
        <div class="mock-row"></div>
        <div class="mock-row"></div>
        <div class="mock-row"></div>
        <div class="mock-row"></div>
        <div class="mock-row"></div>
      </div>
    </div>
  </div>
</div>

<div class="veil" aria-hidden="true"></div>

<main class="panel" role="main">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true">E</span>
    <span class="brand-text">
      <b>EduSphere</b>
      <small>College ERP</small>
    </span>
  </div>

  <h1>This website is<br /><em>under maintenance</em>.</h1>

  <p class="lede">We are making a few updates. Please check back shortly.</p>
</main>

</body>
</html>
